# Copies posts from the old Blogger blog into this repo.
# The first import is done. Run it again only by hand, from
# Actions -> "Import from Blogger" -> Run workflow (e.g. if she posts on Blogger again).
# It only adds or updates posts that came from Blogger. Careful: re-running overwrites edits
# made on the new site to an imported post.
name: Import from Blogger
on:
  workflow_dispatch:
    inputs:
      blogger_url:
        description: "Blogger address"
        default: "https://madlanifalgunis.blogspot.com"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-blogger.mjs
        env:
          BLOGGER_URL: ${{ inputs.blogger_url || 'https://madlanifalgunis.blogspot.com' }}
      - name: Commit imported posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git diff --cached --quiet || git commit -m "Import posts from Blogger"
          git push
